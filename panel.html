<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remueble — Panel de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --brown: #7b3f1e;
    --brown-light: #a0562a;
    --brown-pale: #f5f0eb;
    --brown-border: #e8ddd2;
    --text: #2b1a0e;
    --text-muted: #888;
    --white: #ffffff;
    --green: #2e7d32;
    --green-bg: #e8f5e9;
    --blue: #1565c0;
    --blue-bg: #e3f2fd;
    --orange: #e65100;
    --orange-bg: #fff3e0;
    --red: #c62828;
    --red-bg: #fdecea;
    --shadow: 0 2px 12px rgba(43,26,14,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--brown-pale);
    color: var(--text);
    min-height: 100vh;
  }

  /* LOGIN */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--brown-pale);
  }
  .login-box {
    background: white;
    border-radius: 16px;
    padding: 48px 40px;
    width: 360px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .login-logo {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--brown);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .login-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
  .login-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--brown-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--brown); }
  .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--brown);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }
  .login-btn:hover { background: var(--brown-light); }
  .login-error { font-size: 12px; color: var(--red); margin-top: 8px; display: none; }

  /* PANEL */
  #panel-screen { display: none; }
  .topbar {
    background: white;
    border-bottom: 1px solid var(--brown-border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--brown);
    letter-spacing: 2px;
  }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-count { font-size: 13px; color: var(--text-muted); }
  .btn-logout {
    font-size: 12px;
    color: var(--text-muted);
    background: none;
    border: 1px solid var(--brown-border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--brown); color: var(--brown); }

  .main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    padding: 8px 16px;
    border: 1.5px solid var(--brown-border);
    border-radius: 20px;
    background: white;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .filter-btn:hover { border-color: var(--brown); color: var(--brown); }
  .filter-btn.active { background: var(--brown); color: white; border-color: var(--brown); }
  .filter-estado {
    padding: 8px 12px;
    border: 1.5px solid var(--brown-border);
    border-radius: 20px;
    background: white;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .btn-export {
    margin-left: auto;
    padding: 8px 18px;
    background: var(--brown-pale);
    border: 1.5px solid var(--brown-border);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--brown);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-export:hover { background: var(--brown); color: white; border-color: var(--brown); }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: white;
    border-radius: 12px;
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }
  .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .stat-value { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--brown); }

  /* TABLE */
  .table-wrap {
    background: white;
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead { background: var(--brown-pale); }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  td {
    padding: 14px 16px;
    font-size: 13px;
    border-top: 1px solid var(--brown-border);
    vertical-align: middle;
  }
  tr:hover td { background: #fdfbf9; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: capitalize;
  }
  .badge-vender { background: var(--blue-bg); color: var(--blue); }
  .badge-donar { background: var(--green-bg); color: var(--green); }
  .badge-restaurar { background: var(--orange-bg); color: var(--orange); }
  .badge-pendiente { background: #fff8e1; color: #f57f17; }
  .badge-contactado { background: var(--blue-bg); color: var(--blue); }
  .badge-cerrado { background: var(--green-bg); color: var(--green); }
  .badge-descartado { background: #f3e5f5; color: #6a1b9a; }
  .estado-select {
    padding: 4px 8px;
    border: 1px solid var(--brown-border);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    background: white;
    cursor: pointer;
    outline: none;
    color: var(--text);
  }
  .btn-fotos {
    padding: 4px 10px;
    background: var(--brown-pale);
    border: 1px solid var(--brown-border);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--brown);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-fotos:hover { background: var(--brown); color: white; }
  .btn-fotos:disabled { opacity: 0.4; cursor: not-allowed; }
  .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }
  .empty { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }

  /* MODAL FOTOS */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,26,14,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    max-width: 800px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--brown); }
  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--text-muted);
    line-height: 1;
  }
  .modal-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
    background: var(--brown-pale);
    border-radius: 10px;
    padding: 16px;
  }
  .modal-info-item { font-size: 13px; }
  .modal-info-label { font-weight: 500; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .modal-info-value { color: var(--text); margin-top: 2px; }
  .fotos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .fotos-grid a { display: block; }
  .fotos-grid img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid var(--brown-border);
    transition: transform 0.2s;
  }
  .fotos-grid img:hover { transform: scale(1.02); }
  .no-fotos { font-size: 13px; color: var(--text-muted); text-align: center; padding: 20px; }

  @media (max-width: 900px) {
    .main { padding: 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 0 16px; }
    .modal-info { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">REMUEBLE</div>
    <div class="login-subtitle">Panel de gestión de solicitudes</div>
    <input class="login-input" type="password" id="login-pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- PANEL -->
<div id="panel-screen">
  <div class="topbar">
    <div class="topbar-logo">REMUEBLE</div>
    <div class="topbar-right">
      <span class="topbar-count" id="topbar-count"></span>
      <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total solicitudes</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Vender</div>
        <div class="stat-value" id="stat-vender">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Donar</div>
        <div class="stat-value" id="stat-donar">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Restaurar</div>
        <div class="stat-value" id="stat-restaurar">—</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFlow('todos',this)">Todos</button>
      <button class="filter-btn" onclick="setFlow('vender',this)">Vender</button>
      <button class="filter-btn" onclick="setFlow('donar',this)">Donar</button>
      <button class="filter-btn" onclick="setFlow('restaurar',this)">Restaurar</button>
      <select class="filter-estado" id="filter-estado" onchange="renderTable()">
        <option value="">Todos los estados</option>
        <option value="pendiente">Pendiente</option>
        <option value="contactado">Contactado</option>
        <option value="cerrado">Cerrado</option>
        <option value="descartado">Descartado</option>
      </select>
      <button class="btn-export" onclick="exportExcel()">⬇ Exportar Excel</button>
    </div>

    <div class="table-wrap">
      <div id="table-loading" class="loading">Cargando solicitudes...</div>
      <div id="table-empty" class="empty" style="display:none">No hay solicitudes con estos filtros.</div>
      <table id="main-table" style="display:none">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Flow</th>
            <th>Nombre</th>
            <th>Contacto</th>
            <th>Mueble</th>
            <th>Ubicación</th>
            <th>Estado</th>
            <th>Fotos</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL FOTOS -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Solicitud</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-info" id="modal-info"></div>
    <div class="fotos-grid" id="modal-fotos"></div>
  </div>
</div>

<script>
  var PASS = 'Digivision1234';
  var SB_URL = 'https://bgpabengzbqxwquxjkzw.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJncGFiZW5nemJxeHdxdXhqa3p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzc5NzAsImV4cCI6MjA5NDg1Mzk3MH0.yxuEdZRd9U2DeZ6UKwcVLbuVk9sh55_9zjycksAIWcI';

  var allData = [];
  var currentFlow = 'todos';

  function doLogin() {
    var val = document.getElementById('login-pass').value;
    if (val === PASS) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('panel-screen').style.display = 'block';
      loadData();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function doLogout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('panel-screen').style.display = 'none';
    document.getElementById('login-pass').value = '';
  }

  async function loadData() {
    try {
      var res = await fetch(SB_URL + '/rest/v1/solicitudes?select=*&order=created_at.desc', {
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY
        }
      });
      allData = await res.json();
      updateStats();
      renderTable();
    } catch(e) {
      document.getElementById('table-loading').textContent = 'Error cargando datos.';
    }
  }

  function updateStats() {
    document.getElementById('stat-total').textContent = allData.length;
    document.getElementById('stat-vender').textContent = allData.filter(r=>r.flow==='vender').length;
    document.getElementById('stat-donar').textContent = allData.filter(r=>r.flow==='donar').length;
    document.getElementById('stat-restaurar').textContent = allData.filter(r=>r.flow==='restaurar').length;
    document.getElementById('topbar-count').textContent = allData.length + ' solicitudes';
  }

  function setFlow(flow, btn) {
    currentFlow = flow;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function renderTable() {
    var estadoFilter = document.getElementById('filter-estado').value;
    var filtered = allData.filter(function(r) {
      if (currentFlow !== 'todos' && r.flow !== currentFlow) return false;
      if (estadoFilter && r.estado_gestion !== estadoFilter) return false;
      return true;
    });

    document.getElementById('table-loading').style.display = 'none';

    if (filtered.length === 0) {
      document.getElementById('table-empty').style.display = 'block';
      document.getElementById('main-table').style.display = 'none';
      return;
    }

    document.getElementById('table-empty').style.display = 'none';
    document.getElementById('main-table').style.display = 'table';

    var html = '';
    filtered.forEach(function(r) {
      var fecha = new Date(r.created_at).toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
      var fotos = r.fotos_subidas ? r.fotos_subidas.split(',').map(s=>s.trim()).filter(Boolean) : [];
      html += '<tr>';
      html += '<td style="font-weight:600;color:var(--brown)">#' + r.id + '</td>';
      html += '<td style="color:var(--text-muted);font-size:12px">' + fecha + '</td>';
      html += '<td><span class="badge badge-' + r.flow + '">' + (r.flow||'—') + '</span></td>';
      html += '<td>' + (r.nombre||'—') + '</td>';
      html += '<td style="font-size:12px">' + (r.contacto||'—') + '</td>';
      html += '<td>' + (r.tipo_de_mueble||'—') + (r.cantidad ? ' ×'+r.cantidad : '') + '</td>';
      html += '<td style="color:var(--text-muted)">' + (r.ubicacion||'—') + '</td>';
      html += '<td><select class="estado-select" onchange="updateEstado(' + r.id + ',this.value)">';
      ['pendiente','contactado','cerrado','descartado'].forEach(function(e) {
        html += '<option value="' + e + '"' + (r.estado_gestion===e?' selected':'') + '>' + e.charAt(0).toUpperCase()+e.slice(1) + '</option>';
      });
      html += '</select></td>';
      html += '<td><button class="btn-fotos" onclick="openModal(' + r.id + ')"' + (fotos.length===0?' ':' ') + '>' + (fotos.length>0 ? '📷 '+fotos.length : 'Sin fotos') + '</button></td>';
      html += '</tr>';
    });
    document.getElementById('table-body').innerHTML = html;
  }

  async function updateEstado(id, estado) {
    await fetch(SB_URL + '/rest/v1/solicitudes?id=eq.' + id, {
      method: 'PATCH',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ estado_gestion: estado })
    });
    var row = allData.find(r=>r.id===id);
    if (row) row.estado_gestion = estado;
  }

  function openModal(id) {
    var r = allData.find(function(x){ return x.id === id; });
    if (!r) return;
    document.getElementById('modal-title').textContent = 'Solicitud #' + r.id + ' — ' + (r.flow||'');
    var campos = [
      ['Nombre', r.nombre], ['Contacto', r.contacto], ['Mueble', r.tipo_de_mueble],
      ['Cantidad', r.cantidad], ['Estado', r.estado_del_mueble], ['Ubicación', r.ubicacion],
      ['Precio', r.precio_solicitado ? r.precio_solicitado+'€' : null],
      ['Logística', r.logistica], ['Nota', r.nota_adicional], ['Descripción', r.descripcion_del_mueble]
    ];
    var infoHtml = '';
    campos.forEach(function(c) {
      if (c[1]) infoHtml += '<div class="modal-info-item"><div class="modal-info-label">' + c[0] + '</div><div class="modal-info-value">' + c[1] + '</div></div>';
    });
    document.getElementById('modal-info').innerHTML = infoHtml;
    var fotos = r.fotos_subidas ? r.fotos_subidas.split(',').map(s=>s.trim()).filter(Boolean) : [];
    var fotosHtml = '';
    if (fotos.length > 0) {
      fotos.forEach(function(url) {
        fotosHtml += '<a href="' + url + '" target="_blank"><img src="' + url + '" alt="foto" onerror="this.style.display=\'none\'"></a>';
      });
    } else {
      fotosHtml = '<div class="no-fotos">No hay fotos en esta solicitud.</div>';
    }
    document.getElementById('modal-fotos').innerHTML = fotosHtml;
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function exportExcel() {
    var estadoFilter = document.getElementById('filter-estado').value;
    var filtered = allData.filter(function(r) {
      if (currentFlow !== 'todos' && r.flow !== currentFlow) return false;
      if (estadoFilter && r.estado_gestion !== estadoFilter) return false;
      return true;
    });

    var cols = ['id','created_at','flow','nombre','contacto','tipo_de_mueble','cantidad','estado_del_mueble','ubicacion','precio_solicitado','acepta_ofertas','logistica','estado_gestion','nota_adicional','descripcion_del_mueble','fotos_subidas'];
    var csv = cols.join(';') + '\n';
    filtered.forEach(function(r) {
      csv += cols.map(function(c) {
        var v = r[c] || '';
        return '"' + String(v).replace(/"/g,'""') + '"';
      }).join(';') + '\n';
    });

    var blob = new Blob(['\ufeff'+csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'remueble-solicitudes-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  document.getElementById('login-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
